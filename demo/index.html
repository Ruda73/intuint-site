<link rel="icon" type="image/png" href="/favicon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Intuint Calibration Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a calibration desk. Summary strip, then the evidence (weights, curves, biases), then the work (open decisions, new forecast). */
:root {
  --bg: #f4f4f6; --surface: #ffffff; --sunk: #ebeaee; --ink: #1b1a1f; --ink-2: #4a4851; --muted: #6c6974;
  --line: #dddbe2; --line-2: #c9c6cf;
  --gut: #b86e0a; --intel: #2f6cb0; --blend: #c2417a; --accent: #b0376c; --accent-ink: #ffffff;
  --good: #24794a; --good-bg: #e4f2e9; --bad: #b42318; --bad-bg: #fbe9e7; --idle: #6c6974; --idle-bg: #ecebef;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131215; --surface: #1b1a1e; --sunk: #232227; --ink: #eceaf0; --ink-2: #c4c1ca; --muted: #9e9aa6;
  --line: #2d2b32; --line-2: #3d3a43;
  --gut: #c27f1e; --intel: #5389cf; --blend: #d4578f; --accent: #d4578f; --accent-ink: #1b1a1e;
  --good: #5cb97a; --good-bg: #1c2e23; --bad: #f0796b; --bad-bg: #3a1f1c; --idle: #9e9aa6; --idle-bg: #26252a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131215; --surface: #1b1a1e; --sunk: #232227; --ink: #eceaf0; --ink-2: #c4c1ca; --muted: #9e9aa6;
  --line: #2d2b32; --line-2: #3d3a43;
  --gut: #c27f1e; --intel: #5389cf; --blend: #d4578f; --accent: #d4578f; --accent-ink: #1b1a1e;
  --good: #5cb97a; --good-bg: #1c2e23; --bad: #f0796b; --bad-bg: #3a1f1c; --idle: #9e9aa6; --idle-bg: #26252a;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.mark { font: 700 22px/1 var(--f-display); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 2px; }
.mark i { font-style: normal; color: var(--blend); }
.org { color: var(--muted); font-size: 13px; border-left: 1px solid var(--line); padding-left: 14px; }
.spacer { flex: 1; }
.viewer { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
select, input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 7px 10px; }
select:focus-visible, input:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seal { font: 500 12px/1 var(--f-mono); display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 999px; background: var(--good-bg); color: var(--good); }
.seal.broken { background: var(--bad-bg); color: var(--bad); }

main { padding-block: 22px 60px; display: grid; gap: 28px; }
h1 { font: 600 28px/1.15 var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font: 600 19px/1.2 var(--f-display); margin: 0; text-wrap: balance; }
.lede { color: var(--ink-2); max-width: 68ch; margin: 6px 0 0; }
.eyebrow { font: 600 11px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.note { color: var(--muted); font-size: 12.5px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 14px; }
.panel-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; font-size: 13.5px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* Summary strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.strip > div { padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; }
.strip > div:first-child { border-left: 0; }
.strip .v { font: 500 24px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 6px; }
.strip .s { color: var(--muted); font-size: 12.5px; }
@media (max-width: 700px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip > div:nth-child(3) { border-left: 0; } .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* Legend + chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.sw.dot { width: 9px; height: 9px; border-radius: 50%; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 400 11px var(--f-mono); }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-2); }
.tip { position: fixed; pointer-events: none; z-index: 20; background: var(--ink); color: var(--bg); font: 400 12px/1.45 var(--f-body); padding: 8px 10px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.tip b { font-weight: 600; }

.scorebox { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.scorebox > div { border-radius: 6px; background: var(--sunk); padding: 10px 12px; min-width: 0; }
.scorebox .k { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.scorebox .v { font: 500 20px/1.3 var(--f-mono); }
.scorebox .d { font-size: 12px; color: var(--muted); }

/* Weight rows */
.wrows { display: grid; gap: 0; }
.wrow { display: grid; grid-template-columns: minmax(130px, 1.1fr) minmax(0, 2fr) 92px; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; }
.wrow .dn { font-weight: 600; font-size: 13.5px; }
.wrow .dn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.wbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--sunk); gap: 2px; }
.wbar .g { background: var(--gut); border-radius: 3px 0 0 3px; }
.wbar .i { background: var(--intel); border-radius: 0 3px 3px 0; }
.wlab { display: flex; justify-content: space-between; font: 400 11.5px var(--f-mono); color: var(--muted); margin-top: 5px; }
.verdict { font: 600 12px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; text-align: right; }
.verdict.g { color: var(--gut); } .verdict.i { color: var(--intel); } .verdict.n { color: var(--muted); }
@media (max-width: 560px) { .wrow { grid-template-columns: minmax(0, 1fr) 80px; } .wrow .wcell { grid-column: 1 / -1; order: 3; } }

/* Pills & checks */
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { color: var(--good); background: var(--good-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.idle { color: var(--idle); background: var(--idle-bg); }
.bias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.bias { border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.bias.flagged { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.bias .bh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.bias .bn { font: 600 15px/1.2 var(--f-display); }
.bias p { margin: 0; font-size: 13px; color: var(--ink-2); }
.bias .prompt { font-size: 13px; padding: 8px 10px; background: var(--sunk); border-radius: 4px; color: var(--ink); }
.bias .prompt b { font: 600 10.5px var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: block; margin-bottom: 2px; }
.meter { height: 6px; background: var(--sunk); border-radius: 3px; position: relative; }
.meter span { position: absolute; inset: 0 auto 0 0; background: var(--bad); border-radius: 3px; }

.checks { display: grid; gap: 0 28px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.checks .check:nth-child(2) { border-top: 0; padding-top: 0; }
@media (max-width: 760px) { .checks .check:nth-child(2) { border-top: 1px solid var(--line); padding-top: 12px; } }
.check { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; padding-top: 0; }
.check .cn { font-weight: 600; font-size: 13.5px; }
.check .cd { font-size: 13px; color: var(--ink-2); }
.check .cc { font-size: 12px; color: var(--muted); }
.check ul { margin: 4px 0 0; padding-left: 18px; font: 400 12px/1.6 var(--f-mono); color: var(--ink-2); }

/* Table */
.tablewrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
th { text-align: left; font: 600 11px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; }
td .t { font-weight: 500; }
td .sub { color: var(--muted); font-size: 12px; }
.trio { display: inline-grid; grid-template-columns: auto auto auto; gap: 2px 10px; font: 400 12.5px var(--f-mono); font-variant-numeric: tabular-nums; }
.trio .lab { font: 600 10px var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.flagchip { display: inline-block; font-size: 11.5px; padding: 2px 7px; border-radius: 4px; background: var(--bad-bg); color: var(--bad); margin: 0 4px 4px 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: 500 13px var(--f-body); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Forecast flow */
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.step[aria-disabled="true"] { opacity: .5; }
.step .sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.step h3 { margin: 0; font: 600 16px/1.2 var(--f-display); }
.stepno { font: 500 11px var(--f-mono); color: var(--muted); }
label { font-size: 12.5px; color: var(--ink-2); display: grid; gap: 4px; }
.prob { display: flex; align-items: center; gap: 12px; }
.prob input[type=range] { flex: 1; accent-color: var(--accent); padding: 0; border: 0; }
.prob output { font: 500 24px/1 var(--f-mono); min-width: 3.2ch; text-align: right; }
.timer { font: 500 13px var(--f-mono); color: var(--gut); }
.timer.over { color: var(--bad); }
button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); padding: 9px 14px; font: 600 13.5px var(--f-body); cursor: pointer; }
button.primary:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--r); padding: 8px 12px; font: 500 13px var(--f-body); cursor: pointer; }
.locked { font: 400 11.5px/1.5 var(--f-mono); color: var(--good); word-break: break-all; }
.result-big { font: 500 34px/1 var(--f-mono); color: var(--blend); }
.err { color: var(--bad); font-size: 13px; }
.hidden-analysis { background: var(--sunk); border-radius: 6px; padding: 10px 12px; font-size: 13px; color: var(--ink-2); }

footer { color: var(--muted); font-size: 12px; padding-block: 0 40px; }
@media (prefers-reduced-motion: no-preference) { .fade { animation: fade .3s ease both; } @keyframes fade { from { opacity: .4 } to { opacity: 1 } } }
</style>

    "aria-label": "Rolling 3-month surprisal per forecast for gut, analysis and the track-record blend" });
  const series = [["gut", "Gut", "--gut"], ["analysis", "Analysis", "--intel"], ["blended", "Blend", "--blend"]];
  const vals = trend.flatMap(t => series.map(s => t[s[0]]));
  let lo = Math.floor(Math.min(...vals) * 10) / 10, hi = Math.ceil(Math.max(...vals) * 10) / 10;
  if (hi - lo < 0.3) hi = lo + 0.3;
  const x = i => m.l + (i / (trend.length - 1)) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const g = svgEl("g", { class: "grid" }, svg);
  for (let v = lo; v <= hi + 1e-9; v += 0.1) {
    svgEl("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }, g);
    svgEl("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = v.toFixed(1);
  }
  trend.forEach((t, i) => {
    if ((i % 3 === 0 && i <= trend.length - 3) || i === trend.length - 1)
      svgEl("text", { x: x(i), y: H - 8, "text-anchor": "middle" }, svg).textContent = t.month.slice(2).replace("-", "/");
  });
  series.forEach(([k, label, tok]) => {
    const d = trend.map((t, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(t[k]).toFixed(1)).join("");
    svgEl("path", { d, fill: "none", stroke: css(tok), "stroke-width": k === "blended" ? 2.5 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    const last = trend[trend.length - 1];
    svgEl("circle", { cx: x(trend.length - 1), cy: y(last[k]), r: 4, fill: css(tok), stroke: css("--surface"), "stroke-width": 2 }, svg);
  });
  // direct labels at the right edge, nudged apart so they never collide
  const last = trend[trend.length - 1];
  const labs = series.map(([k, label, tok]) => ({ label, tok, v: last[k], y: y(last[k]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 13) labs[i].y = labs[i - 1].y + 13;
  labs.forEach(l => { const t = svgEl("text", { x: W - m.r + 8, y: l.y + 4 }, svg); t.textContent = l.label + " " + l.v.toFixed(2); t.style.fill = css("--ink-2"); });
  // crosshair + tooltip
  const cross = svgEl("line", { y1: m.t, y2: H - m.b, stroke: css("--line-2"), "stroke-width": 1, visibility: "hidden" }, svg);
  const hit = svgEl("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
  hit.addEventListener("mousemove", e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const i = Math.max(0, Math.min(trend.length - 1, Math.round((p.x - m.l) / (W - m.l - m.r) * (trend.length - 1))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    const t = trend[i];
    showTip(e, `<b>3 months to ${esc(t.month)}</b> · ${t.n} forecasts<br>` +
      series.map(([k, l]) => `${l}: <span class="num">${t[k].toFixed(3)}</span> bits`).join("<br>"));
  });
  hit.addEventListener("mouseleave", () => { cross.setAttribute("visibility", "hidden"); hideTip(); });
  host.appendChild(svg);
}

function calibrationChart(host, gut, intel, title) {
  const W = 340, H = 312, m = { l: 40, r: 14, t: 26, b: 34 };
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": "Calibration curve: " + title });
  const x = v => m.l + v * (W - m.l - m.r), y = v => m.t + (1 - v) * (H - m.t - m.b);
  const g = svgEl("g", { class: "grid" }, svg);
  [0, .25, .5, .75, 1].forEach(v => {
    svgEl("line", { x1: x(0), x2: x(1), y1: y(v), y2: y(v) }, g);
    svgEl("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = (v * 100) + "%";
    svgEl("text", { x: x(v), y: H - 16, "text-anchor": "middle" }, svg).textContent = (v * 100) + "%";
  });
  const ax = svgEl("text", { x: x(.5), y: H - 2, "text-anchor": "middle" }, svg); ax.textContent = "What you said";
  svgEl("line", { x1: x(0), y1: y(0), x2: x(1), y2: y(1), stroke: css("--line-2"), "stroke-width": 1.5, "stroke-dasharray": "4 4" }, svg);
  const pl = svgEl("text", { x: x(.97), y: y(.97) + 14, "text-anchor": "end" }, svg); pl.textContent = "perfect";
  [[gut, "--gut", "Gut"], [intel, "--intel", "Analysis"]].forEach(([s, tok, name]) => {
    if (!s || !s.bins || !s.bins.length) return;
    const bins = s.bins.filter(b => b.n > 0);
    svgEl("path", { d: bins.map((b, i) => (i ? "L" : "M") + x(b.forecast) + "," + y(b.observed)).join(""), fill: "none", stroke: css(tok), "stroke-width": 2 }, svg);
    bins.forEach(b => {
      const c = svgEl("circle", { cx: x(b.forecast), cy: y(b.observed), r: Math.max(4, Math.min(9, 3 + Math.sqrt(b.n))), fill: css(tok), stroke: css("--surface"), "stroke-width": 2 }, svg);
      c.addEventListener("mousemove", e => showTip(e, `<b>${name}</b><br>Said about <span class="num">${pct(b.forecast)}</span><br>Happened <span class="num">${pct(b.observed)}</span> of the time<br><span class="num">${b.n}</span> forecasts`));
      c.addEventListener("mouseleave", hideTip);
    });
  });
  const yl = svgEl("text", { x: 4, y: 11, "text-anchor": "start" }, svg); yl.textContent = "What happened";
  host.appendChild(svg);
}

function skillDots(host, rows) {
  // rows: [{name, gut, analysis, gn, in}] skill vs base rate; zero = no better than the base rate
  const W = 520, rowH = 34, m = { l: 150, r: 16, t: 22, b: 26 }, H = m.t + m.b + rows.length * rowH;
  const vals = rows.flatMap(r => [r.gut, r.analysis]).filter(v => v != null);
  const lo = Math.min(-0.2, Math.floor(Math.min(...vals) * 10) / 10), hi = Math.max(0.4, Math.ceil(Math.max(...vals) * 10) / 10);
  const x = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", "aria-label": "Skill versus base rate by domain, gut and analysis" });
  const g = svgEl("g", { class: "grid" }, svg);
  for (let v = Math.ceil(lo * 10) / 10; v <= hi + 1e-9; v += 0.1) {
    const vv = Math.round(v * 10) / 10;
    svgEl("line", { x1: x(vv), x2: x(vv), y1: m.t - 6, y2: H - m.b }, g);
    if (Math.round(vv * 10) % 2 === 0) svgEl("text", { x: x(vv), y: H - 8, "text-anchor": "middle" }, svg).textContent = vv === 0 ? "0" : sgn(vv, 1);
  }
  svgEl("line", { x1: x(0), x2: x(0), y1: m.t - 10, y2: H - m.b, stroke: css("--ink-2"), "stroke-width": 1.2 }, svg);
  const zl = svgEl("text", { x: x(0) + 5, y: m.t - 10 }, svg); zl.textContent = "base rate"; zl.style.fill = css("--ink-2");
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2;
    const t = svgEl("text", { x: 0, y: cy + 4 }, svg); t.textContent = r.name; t.style.fill = css("--ink"); t.style.font = "500 12.5px " + css("--f-body");
    if (r.gut != null && r.analysis != null)
      svgEl("line", { x1: x(r.gut), x2: x(r.analysis), y1: cy, y2: cy, stroke: css("--line-2"), "stroke-width": 2 }, svg);
    [["gut", "--gut", "Gut", r.gn], ["analysis", "--intel", "Analysis", r.in]].forEach(([k, tok, name, n]) => {
      if (r[k] == null) return;
      const c = svgEl("circle", { cx: x(r[k]), cy, r: 6, fill: css(tok), stroke: css("--surface"), "stroke-width": 2 }, svg);
      c.addEventListener("mousemove", e => showTip(e, `<b>${esc(r.name)} · ${name}</b><br>Skill vs base rate <span class="num">${sgn(r[k])}</span><br><span class="num">${n}</span> resolved forecasts`));
      c.addEventListener("mouseleave", hideTip);
    });
  });
  host.appendChild(svg);
}

// ---------- shared blocks ----------
function weightRow(d) {
  const g = d.gut, i = d.analysis, enough = g && i && g.verdict && i.verdict;
  const wg = d.weights.gut, wi = d.weights.analysis;
  const lead = !g || !i ? "n" : wg > 0.55 ? "g" : wg < 0.45 ? "i" : "n";
  const verdict = !g || !i ? "No record" : !enough ? "Too early" : lead === "g" ? "Trust gut" : lead === "i" ? "Trust analysis" : "Even";
  const sub = g && i ? `skill: gut ${sgn(g.skill)} · analysis ${sgn(i.skill)} · n=${Math.min(g.n, i.n)}` : "no resolved forecasts in this domain";
  return `<div class="wrow">
    <div class="dn">${esc(d.name)}<small class="num">${sub}</small></div>
    <div class="wcell" title="${esc(d.weights.basis)}">
      <div class="wbar" role="img" aria-label="Gut weight ${pct(wg)}, analysis weight ${pct(wi)}"><div class="g" style="width:${wg * 100}%"></div><div class="i" style="width:${wi * 100}%"></div></div>
      <div class="wlab"><span>gut ${pct(wg)}</span><span>analysis ${pct(wi)}</span></div>
    </div>
    <div class="verdict ${enough ? lead : "n"}">${verdict}</div>
  </div>`;
}

function checkBlock(c, showViolations) {
  const v = showViolations && c.violations.length ? `<ul>${c.violations.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  return `<div class="check">
    <div><span class="pill ${c.passed ? "ok" : "bad"}">${c.passed ? "✓ Pass" : "✕ Issue"}</span></div>
    <div style="min-width:0"><div class="cn">${esc(c.name)}</div><div class="cd">${esc(c.detail)}</div>
      <div class="cc">Stops: ${esc(c.counter.toLowerCase())}</div>${v}</div>
  </div>`;
}

function biasCard(b) {
  const status = b.status === "flagged" ? ["bad", "▲ Flagged"] : b.status === "clear" ? ["ok", "✓ Clear"] : ["idle", "… Too early"];
  const ratio = b.metric == null ? 0 : Math.max(0, Math.min(1, b.metric / (b.threshold * 2)));
  return `<div class="bias ${b.status}">
    <div class="bh"><span class="bn">${esc(b.name)}</span><span class="pill ${status[0]}">${status[1]}</span></div>
    <p>${esc(b.evidence)}</p>
    ${b.status !== "insufficient_data" ? `<div class="meter" title="Metric ${b.metric} vs threshold ${b.threshold}"><span style="width:${ratio * 100}%;background:${b.status === "flagged" ? "var(--bad)" : "var(--good)"}"></span></div>
    <div class="note num">metric ${b.metric} · flag above ${b.threshold} · n=${b.n}</div>` : ""}
    ${b.status === "flagged" ? `<div class="prompt"><b>Debiaser prompt</b>${esc(b.debiaser)}</div>` : ""}
  </div>`;
}

const legend = items => `<div class="legend">${items.map(([tok, l, dot]) => `<span><i class="sw ${dot ? "dot" : ""}" style="background:var(${tok})"></i>${l}</span>`).join("")}</div>`;

// ---------- views ----------
function strip(k) {
  return `<div class="strip">
    <div><div class="eyebrow">Decisions logged</div><div class="v">${k.decisions}</div><div class="s">${k.forecasts.toLocaleString("en-ZA")} forecasts</div></div>
    <div><div class="eyebrow">Resolved</div><div class="v">${k.resolved}</div><div class="s">scored against outcomes</div></div>
    <div><div class="eyebrow">Open, at stake</div><div class="v">${zar(k.value_open_zar)}</div><div class="s">${k.open} decisions awaiting outcome</div></div>
    <div><div class="eyebrow">Ledger</div><div class="v">${k.ledger_entries.toLocaleString("en-ZA")}</div><div class="s">${k.ledger_ok ? "entries verified" : "chain broken"}</div></div>
  </div>`;
}

function openTable(rows, mode) {
  const shown = state.showAll ? rows : rows.slice(0, 10);
  const body = shown.map(d => {
    const r = mode === "org" ? d.team : d.mine;
    const flags = mode === "org" ? (r && r.flag_count ? `<span class="flagchip">${r.flag_count} prompt${r.flag_count > 1 ? "s" : ""}</span>` : `<span class="note">none</span>`)
      : (r && r.flags.length ? r.flags.map(f => `<span class="flagchip" title="${esc(f.debiaser)}">${esc(f.name)}</span>`).join("") : `<span class="note">none</span>`);
    const nums = r ? `<span class="trio">
        <span class="lab" style="color:var(--gut)">Gut</span><span class="lab" style="color:var(--intel)">Analysis</span><span class="lab" style="color:var(--blend)">Blend</span>
        <span>${pct(r.gut)}</span><span>${pct(r.analysis)}</span><span><b>${pct(r.blended)}</b></span></span>` : "–";
    const extra = mode === "org" ? (r ? `<span class="num">${pct(r.spread)}</span>` : "–") : (r ? `<span class="num" title="${esc(r.weights.basis)}">${pct(r.weights.gut)} / ${pct(r.weights.analysis)}</span>` : "–");
    return `<tr>
      <td><div class="t">${esc(d.title)}</div><div class="sub">${esc(d.domain)} · resolves ${esc(d.resolve_by)}${d.anchor != null ? ` · quoted figure ${pct(d.anchor)}` : ""}</div><div class="sub">Success: ${esc(d.criteria)}</div></td>
      <td class="r num">${zar(d.value_zar)}</td>
      <td>${nums}</td>
      <td class="r">${extra}</td>
      <td>${flags}</td>
    </tr>`;
  }).join("");
  const more = rows.length > 10 ? `<p><button class="linkbtn" id="toggleAll">${state.showAll ? "Show top 10" : `Show all ${rows.length}`}</button></p>` : "";
  return `<div class="tablewrap"><table>
    <thead><tr><th>Decision &amp; resolution criteria</th><th class="r">Value</th><th>Probability of success</th><th class="r">${mode === "org" ? "Team spread" : "Weight gut / analysis"}</th><th>${mode === "org" ? "Debiaser prompts" : "Debiaser prompts"}</th></tr></thead>
    <tbody>${body || `<tr><td colspan="5" class="note">No open decisions.</td></tr>`}</tbody></table></div>${more}`;
}

function renderOrg(D) {
  const bt = D.backtest;
  const gain = bt && bt.gut ? (1 - bt.blended.surprisal_bits / Math.min(bt.gut.surprisal_bits, bt.analysis.surprisal_bits)) : 0;
  return `
  <div><div class="eyebrow">Organisation view · aggregates only</div>
    <h1>Where judgement at ${esc(D.org)} has earned trust</h1>
    <p class="lede">Every decision is logged as a probability of a defined outcome, gut first, then analysis. Outcomes score both. Individual records stay private to each person; this view shows only what the organisation needs.</p></div>
  ${strip(D.kpis)}
  <div class="grid2">
    <section class="panel">
      <div class="panel-head"><div><h2>Does weighting by track record pay?</h2>
        <p>Walk-forward test on ${bt.n} resolved forecasts. Each blend used only track records available when the decision was made. Lower surprisal is better.</p></div></div>
      <div class="scorebox">
        <div><div class="k"><i class="sw" style="background:var(--gut)"></i>Gut alone</div><div class="v">${bt.gut.surprisal_bits.toFixed(3)}</div><div class="d">bits per forecast</div></div>
        <div><div class="k"><i class="sw" style="background:var(--intel)"></i>Analysis alone</div><div class="v">${bt.analysis.surprisal_bits.toFixed(3)}</div><div class="d">bits per forecast</div></div>
        <div><div class="k"><i class="sw" style="background:var(--blend)"></i>Track-record blend</div><div class="v">${bt.blended.surprisal_bits.toFixed(3)}</div><div class="d">${(gain * 100).toFixed(1)}% less surprise than the better channel</div></div>
      </div>
      <div class="eyebrow" style="margin-bottom:6px">Rolling 3-month surprisal</div>
      <div id="trend"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><h2>Skill by domain</h2>
        <p>How much better than the base rate each channel forecasts, pooled across everyone. Right of the line beats the base rate.</p></div></div>
      ${legend([["--gut", "Gut", 1], ["--intel", "Analysis", 1]])}
      <div id="skill" style="margin-top:10px"></div>
    </section>
  </div>
  <section class="panel">
    <div class="panel-head"><div><h2>Bias prevalence</h2>
      <p>Detected from behaviour in the ledger, never from self-assessment. Counts only; who is flagged is visible only to that person.</p></div></div>
    <div class="bias-grid">${D.bias_prevalence.map(b => `<div class="bias ${b.flagged ? "flagged" : ""}">
      <div class="bh"><span class="bn">${esc(b.name)}</span><span class="pill ${b.flagged ? "bad" : b.assessed ? "ok" : "idle"}">${b.flagged ? `▲ ${b.flagged} of ${b.assessed}` : b.assessed ? `✓ 0 of ${b.assessed}` : "… Too early"}</span></div>
      <p>${b.flagged} of ${b.assessed} people with enough data show this pattern.</p>
      <div class="prompt"><b>Debiaser prompt</b>${esc(b.debiaser)}</div></div>`).join("")}</div>
  </section>
  <section class="panel">
      <div class="panel-head"><div><h2>Open decisions</h2><p>Team view: average of each person's track-record blend. Spread is the gap between the most and least optimistic forecaster.</p></div></div>
      ${openTable(D.open_decisions, "org")}
  </section>
  <section class="panel">
    <div class="panel-head"><div><h2>Integrity</h2><p>Each check closes one way to game the system.</p></div></div>
    <div class="checks">${D.integrity.map(c => checkBlock(c, false)).join("")}</div>
  </section>`;
}

function renderMe(D) {
  const me = D.me;
  const flagged = me.biases.filter(b => b.status === "flagged");
  const withData = me.domains.filter(d => d.gut && d.analysis);
  const domOpts = withData.map(d => `<option value="${d.key}">${esc(d.name)}</option>`).join("");
  return `
  <div><div class="eyebrow">Private view · only ${esc(me.name.split(" ")[0])} sees this</div>
    <h1>${esc(me.name)}, here is where your gut has earned trust</h1>
    <p class="lede">${esc(me.title)}. Weights come from your resolved forecasts and are pulled toward an even split until the evidence is strong. ${flagged.length ? `${flagged.length} pattern${flagged.length > 1 ? "s" : ""} flagged below, each with a prompt you will see on the decisions it affects.` : "No bias patterns flagged."}</p></div>
  ${strip(D.kpis)}
  <div class="grid2">
    <section class="panel">
      <div class="panel-head"><div><h2>Channel weights by domain</h2><p>Hover a bar for the basis. Verdicts appear only after 20 resolved forecasts per channel.</p></div>
        ${legend([["--gut", "Gut"], ["--intel", "Analysis"]])}</div>
      <div class="wrows">${me.domains.map(weightRow).join("")}</div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><h2>Calibration</h2><p>When you said 70%, did it happen 70% of the time? Dots on the dashed line are perfectly calibrated; dot size shows how many forecasts.</p></div></div>
      ${withData.length ? `<label for="calDom" style="max-width:260px">Domain<select id="calDom">${domOpts}</select></label>
      <div style="margin-top:10px">${legend([["--gut", "Gut", 1], ["--intel", "Analysis", 1]])}</div>
      <div id="cal" style="max-width:420px;margin-top:6px"></div>` : `<p class="note">No resolved forecasts yet.</p>`}
    </section>
  </div>
  <section class="panel">
    <div class="panel-head"><div><h2>Your bias profile</h2><p>Each pattern is measured from what you forecast against what happened, with a minimum sample before any verdict.</p></div></div>
    <div class="bias-grid">${me.biases.map(biasCard).join("")}</div>
  </section>
  ${flowPanel(D)}
  <section class="panel">
      <div class="panel-head"><div><h2>Your open decisions</h2><p>Blend = your gut and analysis combined in log-odds, weighted by your record in that domain.</p></div></div>
      ${openTable(D.open_decisions, "me")}
  </section>
  <section class="panel">
    <div class="panel-head"><div><h2>Integrity</h2><p>Organisation-wide checks. Where one of your own entries is involved, it is listed under the check.</p></div></div>
    <div class="checks">${D.integrity.map(c => checkBlock(c, true)).join("")}</div>
  </section>`;
}

// ---------- new forecast flow (gut first, timeboxed, then analysis) ----------
function flowPanel(D) {
  const opts = D.domains.map(d => `<option value="${d.key}">${esc(d.name)}</option>`).join("");
  return `<section class="panel" id="flow">
    <div class="panel-head"><div><h2>New decision</h2>
      <p>Gut first, inside 60 seconds and before you see any analysis. It locks with a fingerprint and cannot be edited. Then the analysis, then the blend.${STATIC ? " This preview computes the blend in your browser and does not save." : ""}</p></div></div>
    <div class="flow">
      <div class="step" id="s1">
        <div class="sh"><h3>Define the bet</h3><span class="stepno">1 of 3</span></div>
        <label for="nTitle">Decision<input id="nTitle" value="Replace 8 haul trucks, Shaft C"></label>
        <label for="nDom">Domain<select id="nDom">${opts}</select></label>
        <label for="nVal">Value (R millions)<input id="nVal" type="number" min="0" step="0.1" value="40"></label>
        <label for="nCrit">Success means (set by Risk Office)<textarea id="nCrit" rows="2">Fleet availability above 85% averaged over months 10–12</textarea></label>
        <button class="primary" id="go1">Start gut forecast</button>
      </div>
      <div class="step" id="s2" aria-disabled="true">
        <div class="sh"><h3>Gut</h3><span class="timer" id="timer">60s</span></div>
        <p class="note" style="margin:0">Probability the success criteria will be met. No spreadsheets, no reasons.</p>
        <div class="prob"><input id="pGut" type="range" min="1" max="99" value="50" disabled aria-label="Gut probability"><output id="oGut">50%</output></div>
        <button class="primary" id="go2" disabled>Lock gut</button>
        <div class="locked" id="lock1"></div>
      </div>
      <div class="step" id="s3" aria-disabled="true">
        <div class="sh"><h3>Analysis, then blend</h3><span class="stepno">3 of 3</span></div>
        <div class="hidden-analysis" id="ana">Unlocks after your gut forecast is locked.</div>
        <div class="prob"><input id="pInt" type="range" min="1" max="99" value="50" disabled aria-label="Analysis probability"><output id="oInt">50%</output></div>
        <button class="primary" id="go3" disabled>Lock analysis</button>
        <div id="res"></div>
      </div>
    </div>
  </section>`;
}

async function fingerprint(obj) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(JSON.stringify(obj)));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return "(fingerprint unavailable)"; }
}
const lo = p => Math.log(p / (1 - p));
const blendP = (g, i, w) => 1 / (1 + Math.exp(-(w.gut * lo(g) + w.analysis * lo(i))));

function wireFlow(D) {
  const s2 = $("#s2"), s3 = $("#s3");
  if (!s2) return;
  let t0 = 0, tick = null, decisionId = null, gutLocked = null;
  const pg = $("#pGut"), pi = $("#pInt");
  pg.addEventListener("input", () => $("#oGut").textContent = pg.value + "%");
  pi.addEventListener("input", () => $("#oInt").textContent = pi.value + "%");
  $("#go1").addEventListener("click", async () => {
    const body = { viewer: D.viewer, title: $("#nTitle").value.trim(), domain: $("#nDom").value,
      value_zar: Math.max(0, parseFloat($("#nVal").value || "0")) * 1e6, criteria: $("#nCrit").value.trim() };
    if (!body.title || !body.criteria) { $("#lock1").innerHTML = `<span class="err">Add a decision and its success criteria first.</span>`; return; }
    try { decisionId = STATIC ? "preview-" + Date.now() : (await api("/api/decisions", body)).id; }
    catch (e) { $("#lock1").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
    ["nTitle", "nDom", "nVal", "nCrit", "go1"].forEach(id => $("#" + id).disabled = true);
    s2.setAttribute("aria-disabled", "false"); pg.disabled = false; $("#go2").disabled = false; pg.focus();
    t0 = performance.now();
    tick = setInterval(() => {
      const left = 60 - (performance.now() - t0) / 1000;
      $("#timer").textContent = left > 0 ? Math.ceil(left) + "s" : "over time";
      $("#timer").classList.toggle("over", left <= 0);
    }, 250);
  });
  $("#go2").addEventListener("click", async () => {
    const secs = (performance.now() - t0) / 1000; clearInterval(tick);
    const rec = { decision_id: decisionId, person_id: D.viewer, channel: "gut", probability: pg.value / 100, elicitation_seconds: +secs.toFixed(1) };
    let hash;
    try { hash = STATIC ? await fingerprint(rec) : (await api("/api/forecasts", rec)).ledger_hash; }
    catch (e) { $("#lock1").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
    gutLocked = rec.probability;
    pg.disabled = true; $("#go2").disabled = true;
    $("#lock1").innerHTML = `Locked at ${secs.toFixed(0)}s${secs > 60 ? " (over the 60s window; this will show in integrity)" : ""}<br>${esc(hash.slice(0, 32))}…`;
    s3.setAttribute("aria-disabled", "false"); pi.disabled = false; $("#go3").disabled = false;
    const dom = D.me.domains.find(d => d.key === $("#nDom").value);
    const sk = dom && dom.gut && dom.analysis ? `In ${esc(dom.name)} your analysis has a skill of ${sgn(dom.analysis.skill)} against the base rate, and your gut ${sgn(dom.gut.skill)}.` : "You have no track record in this domain yet, so both channels will weigh equally.";
    $("#ana").innerHTML = `Now review the evidence: OEM data, site history, the base rate (${pct(dom ? dom.base_rate : 0.5)} of similar decisions succeed). ${sk}`;
    pi.focus();
  });
  $("#go3").addEventListener("click", async () => {
    const dk = $("#nDom").value, dom = D.me.domains.find(d => d.key === dk);
    const rec = { decision_id: decisionId, person_id: D.viewer, channel: "analysis", probability: pi.value / 100, elicitation_seconds: 600 };
    let rmd = null;
    try { if (!STATIC) rmd = (await api("/api/forecasts", rec)).recommendation; }
    catch (e) { $("#res").innerHTML = `<span class="err">${esc(e.message)}</span>`; return; }
    pi.disabled = true; $("#go3").disabled = true;
    const w = rmd ? rmd.weights : dom.weights;
    const p = rmd ? rmd.blended : blendP(gutLocked, rec.probability, w);
    const domainFlags = { anchoring: ["reliability", "pricing"], sunk_cost: ["capex"] };
    const flags = rmd ? rmd.flags : D.me.biases.filter(b => b.status === "flagged" && (!domainFlags[b.key] || domainFlags[b.key].includes(dk)) && b.key !== "availability" && b.key !== "status_quo");
    $("#res").innerHTML = `<div class="fade" style="display:grid;gap:8px;margin-top:4px">
      <div class="eyebrow">Track-record blend</div><div class="result-big">${pct(p)}</div>
      <div class="note num">gut ${pct(gutLocked)} × ${pct(w.gut)} · analysis ${pct(rec.probability)} × ${pct(w.analysis)}</div>
      <div class="note">${esc(w.basis)}</div>
      ${flags.length ? flags.map(f => `<div class="bias" style="padding:10px"><div class="prompt"><b>${esc(f.name)}</b>${esc(f.debiaser)}</div></div>`).join("") : ""}
    </div>`;
  });
}

// ---------- render ----------
async function render() {
  const app = $("#app");
  try { state.data = await load(state.viewer); }
  catch (e) { app.innerHTML = `<section class="panel"><h2>Dashboard unavailable</h2><p class="err">${esc(e.message)} Check that the Intuint server is running, then reload.</p></section>`; return; }
  const D = state.data;
  $("#org").textContent = D.org;
  const sel = $("#viewer");
  sel.innerHTML = D.viewers.map(v => `<option value="${v.id}" ${v.id === D.viewer ? "selected" : ""}>${esc(v.name)}${v.title ? " · " + esc(v.title) : ""}</option>`).join("");
  const seal = $("#seal");
  seal.className = "seal" + (D.kpis.ledger_ok ? "" : " broken");
  seal.textContent = (D.kpis.ledger_ok ? "✓ ledger " : "✕ ledger ") + D.kpis.ledger_head.slice(0, 8);
  app.innerHTML = D.viewer === "org" ? renderOrg(D) : renderMe(D);
  if (D.backtest && $("#trend")) trendChart($("#trend"), D.backtest.trend);
  if ($("#skill")) skillDots($("#skill"), D.channel_by_domain.map(r => ({ name: r.domain, gut: r.gut.skill, analysis: r.analysis.skill, gn: r.gut.n, in: r.analysis.n })));
  const cd = $("#calDom");
  if (cd) {
    const pick = () => { const d = D.me.domains.find(x => x.key === cd.value); $("#cal").innerHTML = ""; calibrationChart($("#cal"), d.gut, d.analysis, d.name); };
    const best = D.me.domains.filter(d => d.gut && d.analysis).sort((a, b) => b.gut.n - a.gut.n)[0];
    if (best) cd.value = best.key;
    cd.addEventListener("change", pick); pick();
  }
  const ta = $("#toggleAll");
  if (ta) ta.addEventListener("click", () => { state.showAll = !state.showAll; render(); });
  wireFlow(D);
  $("#foot").innerHTML = `Intuint · ${STATIC ? "static demo snapshot of " : ""}${esc(D.org)}. Fictional data generated for demonstration. Scores use proper scoring rules (Brier, logarithmic), so honest forecasting is the best strategy.`;
}

$("#viewer").addEventListener("change", e => {
  state.viewer = e.target.value; state.showAll = false;
  try { localStorage.setItem("intuint.viewer", state.viewer); } catch (err) {}
  render(); scrollTo({ top: 0 });
});
if (STATIC && !window.INTUINT_DATA.views[state.viewer]) state.viewer = "org";
render();
})();
</script>
